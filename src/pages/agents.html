<div class="page" data-page="agents">
    <div class="page-header">
        <h1>AI Agent Panel</h1>
        <span class="subtitle"
            >Configure, activate, and monitor autonomous
            agents</span
        >
        <span class="flex-1"></span>
        <button class="btn btn-ghost" id="run-cycle-btn">
            ▶ Run Cycle Now
        </button>
    </div>
    <div
        style="
            padding: 20px;
            overflow: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        "
    >
        <div
            id="agents-list"
            style="
                display: flex;
                flex-direction: column;
                gap: 16px;
            "
        ></div>
    </div>
</div>

<!-- Agent Configuration Modal -->
<div class="modal-overlay" id="config-modal">
    <div class="modal">
        <div class="modal-header">
            <h2>Configure Agent</h2>
            <button
                class="btn btn-ghost btn-sm btn-icon"
                id="close-config-modal"
            >
                ✕
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Agent Name</label>
                <input type="text" id="config-name" readonly />
            </div>
            <div class="form-group">
                <label>Role</label>
                <input type="text" id="config-role" readonly />
            </div>
            <div class="form-group">
                <label>Endpoint Type</label>
                <select id="config-endpoint-type">
                    <option value="ollama">Ollama (Local)</option>
                    <option value="openai">OpenAI Compatible</option>
                    <option value="anthropic">Anthropic Claude</option>
                </select>
            </div>
            <div class="form-group">
                <label>Endpoint URL</label>
                <input
                    type="url"
                    id="config-endpoint-url"
                    placeholder="http://localhost:11434"
                />
            </div>
            <div class="form-group">
                <label>Model</label>
                <input
                    type="text"
                    id="config-model"
                    placeholder="llama2, gpt-4, etc."
                />
            </div>
            <div class="form-group">
                <label>API Key (if needed)</label>
                <input
                    type="password"
                    id="config-api-key"
                    placeholder="Leave blank for local models"
                />
                <button
                    type="button"
                    class="btn btn-ghost btn-sm"
                    id="toggle-api-key-field"
                    style="margin-top: 6px"
                >
                    Show/Hide
                </button>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" id="save-config-btn">
                Save Configuration
            </button>
            <button class="btn btn-ghost" id="cancel-config-btn">
                Cancel
            </button>
        </div>
    </div>
</div>

<!-- Agent Memory Modal -->
<div class="modal-overlay" id="memory-modal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="memory-modal-title">memory.json</h2>
            <button
                class="btn btn-ghost btn-sm btn-icon"
                id="close-memory-modal"
            >
                ✕
            </button>
        </div>
        <div class="modal-body">
            <textarea
                id="memory-modal-content"
                style="
                    width: 100%;
                    height: 400px;
                    font-family: monospace;
                    font-size: 12px;
                    padding: 12px;
                    background: var(--bg-input);
                    border: 1px solid var(--border);
                    border-radius: 4px;
                    color: var(--text-primary);
                    resize: vertical;
                "
                readonly
            ></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" id="copy-memory-btn">
                Copy to Clipboard
            </button>
            <button class="btn btn-ghost" id="close-memory-modal-btn">
                Close
            </button>
        </div>
    </div>
</div>

<!-- Agent Soul Modal -->
<div class="modal-overlay" id="soul-modal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="soul-modal-title">soul.md</h2>
            <button
                class="btn btn-ghost btn-sm btn-icon"
                id="close-soul-modal"
            >
                ✕
            </button>
        </div>
        <div class="modal-body">
            <div
                id="soul-modal-content"
                style="
                    max-height: 500px;
                    overflow-y: auto;
                    padding: 12px;
                    background: var(--bg-input);
                    border: 1px solid var(--border);
                    border-radius: 4px;
                    color: var(--text-primary);
                    font-size: 13px;
                    line-height: 1.6;
                    white-space: pre-wrap;
                    word-wrap: break-word;
                    font-family: 'IBM Plex Mono', monospace;
                "
            ></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" id="close-soul-modal-btn">
                Close
            </button>
        </div>
    </div>
</div>
