<div class="page" data-page="chat">
    <div class="page-header">
        <h1>Direct Chat</h1>
        <span class="subtitle"
            >Speak directly with any agent — bypasses the
            message board</span
        >
        <span class="flex-1"></span>
        <button
            class="btn btn-ghost btn-sm"
            id="chat-clear-btn"
        >
            Clear Chat
        </button>
    </div>
    <div
        style="
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-panel);
        "
    >
        <label
            style="
                font-family: var(--font-mono);
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--text-secondary);
                white-space: nowrap;
            "
        >
            Talk to
        </label>
        <select
            id="chat-agent-select"
            style="width: 260px"
        ></select>
    </div>
    <div
        id="chat-messages"
        style="
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        "
    >
        <div class="empty-state">
            <div class="icon">💬</div>
            <p>Select an agent above to start a conversation</p>
        </div>
    </div>
    <div
        style="
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--bg-panel);
        "
    >
        <textarea
            id="chat-input"
            rows="2"
            placeholder="Type a message... Enter to send, Shift+Enter for new line"
            style="flex: 1; min-height: 60px; resize: none"
        ></textarea>
        <button
            class="btn btn-primary"
            id="chat-send-btn"
            style="height: 60px; padding: 0 24px"
        >
            Send
        </button>
    </div>
</div>
