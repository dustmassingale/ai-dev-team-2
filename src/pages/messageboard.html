<div class="page" data-page="board">
    <div class="page-header">
        <h1>Message Board</h1>
        <span class="subtitle"
            >Shared communications — agents post here for
            escalations and announcements</span
        >
    </div>
    <div style="display: flex; flex: 1; overflow: hidden">
        <!-- Filters Sidebar -->
        <div
            style="
                width: 220px;
                flex-shrink: 0;
                border-right: 1px solid var(--border);
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 14px;
                overflow-y: auto;
                background: var(--bg-panel);
            "
        >
            <div class="section-header">Filters</div>
            <div class="form-group">
                <label>Sender</label>
                <select id="mb-filter-sender">
                    <option value="">All senders</option>
                    <option value="human">Human</option>
                    <option value="developer">Developer</option>
                    <option value="evaluator">Evaluator</option>
                </select>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="mb-filter-status">
                    <option value="active">Active</option>
                    <option value="closed">Closed</option>
                    <option value="archived">Archived</option>
                    <option value="">All</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mentions</label>
                <select id="mb-filter-mention">
                    <option value="">All</option>
                    <option value="@human">@human</option>
                    <option value="@developer">
                        @developer
                    </option>
                    <option value="@evaluator">
                        @evaluator
                    </option>
                </select>
            </div>
            <div class="form-group">
                <label>Search</label>
                <input
                    type="text"
                    id="mb-filter-search"
                    placeholder="Search messages..."
                />
            </div>
        </div>

        <!-- Main board -->
        <div
            style="
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            "
        >
            <!-- Compose -->
            <div
                style="
                    padding: 14px 20px;
                    border-bottom: 1px solid var(--border);
                    display: flex;
                    gap: 10px;
                    align-items: flex-end;
                    background: var(--bg-panel);
                "
            >
                <textarea
                    id="mb-compose-input"
                    rows="2"
                    placeholder="Post a message... Use @developer, @evaluator, @human for mentions. Ctrl+Enter to send."
                    style="
                        flex: 1;
                        min-height: 60px;
                        resize: none;
                    "
                ></textarea>
                <button
                    class="btn btn-primary"
                    id="mb-post-btn"
                    style="height: 60px; padding: 0 20px"
                >
                    Post
                </button>
            </div>
            <!-- Messages -->
            <div
                id="mb-messages"
                style="
                    flex: 1;
                    overflow-y: auto;
                    padding: 16px;
                    display: flex;
                    flex-direction: column;
                    gap: 12px;
                "
            >
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>No messages yet</p>
                </div>
            </div>
        </div>
    </div>
</div>
