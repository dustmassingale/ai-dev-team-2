<div class="page" data-page="kanban">
    <div class="page-header">
        <h1>Kanban Board</h1>
        <span class="subtitle"
            >Drag cards between columns or open them to manage
            details</span
        >
        <span class="spacer flex-1"></span>
        <button class="btn btn-primary" id="new-task-btn">
            + New Task
        </button>
    </div>
    <div
        id="kanban-board"
        class="kanban-board overflow-auto flex-1 p-16"
    ></div>
</div>

<!-- Task Detail Modal -->
<div class="modal-overlay" id="task-modal">
    <div
        class="modal"
        style="width: min(720px, 95vw); max-height: 90vh"
    >
        <div class="modal-header">
            <h2 id="modal-task-title">Task</h2>
            <span id="modal-task-status"></span>
            <button
                class="btn btn-ghost btn-sm btn-icon"
                id="close-task-modal"
            >
                ✕
            </button>
        </div>
        <div class="modal-body" style="gap: 20px">
            <div class="flex gap-16">
                <div class="form-group flex-1">
                    <label></label>Repository</label>
                    <div
                        id="modal-task-repo"
                        class="text-mono text-sm"
                        style="
                            color: var(--text-primary);
                            padding: 8px 0;
                            word-break: break-all;
                        "
                    ></div>
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <div
                        id="modal-task-branch"
                        class="text-mono text-sm"
                        style="
                            color: var(--accent);
                            padding: 8px 0;
                        "
                    ></div>
                </div>
            </div>
            <div>
                <div class="section-header">Description</div>
                <div
                    id="modal-task-desc"
                    class="prose-content"
                ></div>
            </div>
            <div>
                <div class="section-header">
                    Implementation Plan
                </div>
                <div
                    id="modal-task-plan"
                    class="prose-content"
                ></div>
            </div>
            <div>
                <div class="section-header">Comments</div>
                <div
                    id="modal-comments-list"
                    style="
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                        margin-bottom: 12px;
                    "
                ></div>
                <div class="flex gap-8">
                    <input
                        type="text"
                        id="modal-comment-input"
                        placeholder="Add a comment..."
                        style="flex: 1"
                    />
                    <button
                        class="btn btn-ghost btn-sm"
                        id="modal-add-comment"
                    >
                        Post
                    </button>
                </div>
            </div>
            <div class="divider"></div>
            <div class="flex gap-8 items-center">
                <label
                    class="form-group"
                    style="
                        flex-direction: row;
                        align-items: center;
                        gap: 8px;
                        margin: 0;
                    "
                >
                    <span
                        style="
                            font-family: var(--font-mono);
                            font-size: 10px;
                            font-weight: 600;
                            letter-spacing: 0.1em;
                            text-transform: uppercase;
                            color: var(--text-secondary);
                        "
                        >Move to</span
                    >
                    <select
                        id="modal-move-select"
                        style="width: 140px"
                    ></select>
                </label>
                <button
                    class="btn btn-primary btn-sm"
                    id="modal-move-btn"
                >
                    Move
                </button>
                <span class="flex-1"></span>
                <button
                    class="btn btn-danger btn-sm"
                    id="modal-delete-btn"
                >
                    Delete Task
                </button>
            </div>
        </div>
    </div>
</div>

<!-- New Task Modal -->
<div class="modal-overlay" id="new-task-modal">
    <div class="modal">
        <div class="modal-header">
            <h2>New Task</h2>
            <button
                class="btn btn-ghost btn-sm btn-icon"
                id="cancel-new-task"
            >
                ✕
            </button>
        </div>
        <form id="new-task-form">
            <div class="modal-body">
                <div class="form-group">
                    <label>Title</label>
                    <input
                        type="text"
                        name="title"
                        placeholder="Task title"
                        required
                    />
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea
                        name="description"
                        placeholder="Describe the task... (Markdown supported)"
                        rows="4"
                    ></textarea>
                </div>
                <div class="form-group">
                    <label>Repository URL</label>
                    <input
                        type="text"
                        name="repo"
                        placeholder="https://github.com/org/repo"
                    />
                </div>
                <div class="form-group">
                    <label>Desired Branch Name</label>
                    <input
                        type="text"
                        name="branch"
                        placeholder="feature/my-feature"
                    />
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-ghost"
                    id="cancel-new-task-2"
                    onclick="
                        document
                            .getElementById('new-task-modal')
                            .classList.remove('open');
                        document
                            .getElementById('new-task-form')
                            .reset();
                    "
                >
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    Create Task
                </button>
            </div>
        </form>
    </div>
</div>
